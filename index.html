<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#d83a58" />
    <title>For Selin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Vazirmatn:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="question-card" aria-labelledby="question">
        <h1 id="question">Selin, will you date me?</h1>

        <div class="choice-area" id="choice-area">
          <button class="answer-button yes-button" id="yes-button" type="button" aria-label="Yes">
            <video class="choice-video" autoplay muted loop playsinline preload="auto" aria-hidden="true">
              <source src="yes.webm" type="video/webm" />
            </video>
            <span class="choice-label">Yes</span>
          </button>
        </div>

        <p class="answer-message" id="answer-message" aria-live="polite"></p>
        <p class="no-message" id="no-message" aria-live="assertive"></p>
      </section>
    </main>
    <button
      class="answer-button no-button"
      id="no-button"
      type="button"
      disabled
      aria-disabled="true"
      tabindex="-1"
      aria-label="No"
    >
      <video class="choice-video" autoplay muted loop playsinline preload="auto" aria-hidden="true" src="no.MOV"></video>
      <span class="choice-label">No</span>
    </button>

    <div class="story-overlay" id="story-overlay" hidden>
      <section class="story-card" role="dialog" aria-modal="true" aria-labelledby="story-text" dir="rtl">
        <p class="story-text" id="story-text"></p>
        <button class="story-next" id="story-next" type="button">بعدی</button>
      </section>
    </div>

    <div class="celebration-overlay" id="celebration-overlay" hidden>
      <section class="celebration-card" role="dialog" aria-modal="true" aria-labelledby="celebration-text" dir="rtl">
        <div class="confetti" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
        <div class="proud-figure" role="img" aria-label="A proud person celebrating">
          <video class="celebration-video" autoplay muted loop playsinline aria-hidden="true">
            <source src="yess.webm" type="video/webm" />
          </video>
        </div>
        <p class="celebration-text" id="celebration-text">انتخابتو دوست داشتم<br />بهت زنگ می‌زنم</p>
        <button class="celebration-close" id="celebration-close" type="button">باشه</button>
      </section>
    </div>

    <script src="script.js"></script>
  </body>
</html>
