<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#d83a58" />
    <title>For Selin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="question-card" aria-labelledby="question">
        <h1 id="question">Selin, will you date me?</h1>

        <div class="choice-area" id="choice-area">
          <button class="answer-button yes-button" id="yes-button" type="button" aria-label="Yes">
            <video class="choice-video" autoplay muted loop playsinline preload="auto" aria-hidden="true">
              <source src="yes.webm" type="video/webm" />
            </video>
            <span class="choice-label">Yes</span>
          </button>
        </div>

        <p class="answer-message" id="answer-message" aria-live="polite"></p>
      </section>
    </main>
    <button
      class="answer-button no-button"
      id="no-button"
      type="button"
      disabled
      aria-disabled="true"
      tabindex="-1"
      aria-label="No"
    >
      <video class="choice-video" autoplay muted loop playsinline preload="auto" aria-hidden="true">
        <source src="no.MOV" type="video/quicktime" />
      </video>
      <span class="choice-label">No</span>
    </button>

    <script src="script.js"></script>
  </body>
</html>
